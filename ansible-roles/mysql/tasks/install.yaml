---
- name: Get MySQL APT key
  ansible.builtin.apt_key:
    keyserver: "{{ mysql_key_server }}"
    id: "{{ mysql_key_id }}"
    state: present
- name: Add MySQL repo to source list
  ansible.builtin.apt_repository:
    repo: "deb http://repo.mysql.com/apt/ubuntu/ {{ distro }} {{ mysql_series }}"
    state: present
- name: Install MySQL server
  ansible.builtin.apt:
    pkg:
      - mysql-server
      - python3-pip
      - python3-mysqldb # required to use 'mysql_db' module
    state: present
    update_cache: true
- name: Custom configuration
  ansible.builtin.template:
    src: 10-liftoff-mysql.cnf.j2
    dest: /etc/mysql/conf.d/10-liftoff-mysql.cnf
    mode: '0644'
- name: Restart Mysql service
  ansible.builtin.systemd:
    name: mysql
    state: restarted
- name: Change password for root user
  community.mysql.mysql_user:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_port: "{{ mysql_port }}"
    login_host: "{{ db_host }}"
    check_implicit_admin: true
    name: root
    password: "{{ mysql_root_password }}"
    salt: "{{ lookup('community.general.random_string', length=20) }}"
    plugin: sha256_password
    plugin_auth_string: "{{ mysql_root_password }}"
    with_items:
      - "localhost"
      - "127.0.0.1"
      - "::1"
