---
# installation variable
distro: noble
pg_version: "17"
pg_port: 5432
pg_apt_repo_key: https://www.postgresql.org/media/keys/ACCC4CF8.asc
pg_user: "postgres"
pg_user_password: pg-user-password-123
pg_hba_method: scram-sha-256
localhost_only: false
# database operations to perform. Possible values:
# - install - install and configure PostgreSQL
# - create_user - create a new user
# - create_db - create a new database
# - manage_privs - manage privileges
operations: []

# database management variables
db_host: "127.0.0.1"
